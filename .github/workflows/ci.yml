# Offline CI: runs the unit suite on Python 3.12 only. No other Python version is claimed.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional imaging dependency (some tests exercise Pillow)
        run: python -m pip install pillow
      - name: Unit tests (offline; no network, FS42, display or hardware)
        run: python -m unittest discover -s tests -q
