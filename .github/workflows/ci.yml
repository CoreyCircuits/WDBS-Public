# Offline CI for the public candidate. NOT RUN yet: no workflow execution has been performed on this tree.
# The Python version below is a planning choice and is not a verified support claim.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional imaging dependency (some tests exercise Pillow)
        run: python -m pip install pillow
      - name: Unit tests (offline; no network, FS42, display or hardware)
        run: python -m unittest discover -s tests -q
