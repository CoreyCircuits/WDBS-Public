<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WDBS Stream</title>
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <!-- backdrop: two crossfading prints, cross-process tint, vignette (Gen X Soft Club: Lomo / bleach bypass) -->
  <div id="bg" aria-hidden="true">
    <div class="bgimg" id="bgA"></div><div class="bgimg" id="bgB"></div>
    <div class="xpro"></div><div class="scrim"></div><div id="grain"></div>
  </div>

  <!-- Vectordelia, modestly: one striped circle, one swoosh, a few sparkles (static) -->
  <svg id="deco" aria-hidden="true" viewBox="0 0 640 520" width="640" height="520">
    <defs>
      <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
        <rect width="22" height="11" fill="#DD9B51"/>
      </pattern>
      <linearGradient id="swoosh" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#BF6475" stop-opacity="0"/>
        <stop offset=".45" stop-color="#BF6475"/>
        <stop offset="1" stop-color="#DD9B51"/>
      </linearGradient>
    </defs>
    <circle cx="430" cy="250" r="170" fill="url(#stripes)" opacity=".55"/>
    <circle cx="430" cy="250" r="170" fill="none" stroke="#F6F1E8" stroke-opacity=".5" stroke-width="3"/>
    <path d="M20 420 C 160 330, 300 470, 420 360 S 600 240, 640 300" fill="none" stroke="url(#swoosh)" stroke-width="16" stroke-linecap="round"/>
    <path d="M60 460 C 200 380, 320 500, 460 400" fill="none" stroke="#F6F1E8" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
    <g fill="#F6F1E8">
      <path d="M250 70 l9 27 27 9 -27 9 -9 27 -9 -27 -27 -9 27 -9z" opacity=".85"/>
      <path d="M590 130 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6z" opacity=".7"/>
      <path d="M140 250 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity=".6"/>
    </g>
  </svg>

  <!-- header = a departure board (urban / transit typography) -->
  <header id="top">
    <div class="brand"><img src="/img/wdbs_00s.png" alt="WDBS"><span>STREAM</span></div>
    <nav id="tabs">
      <button data-tab="home"><i class="bullet" style="--c:var(--honey)"></i>Home</button>
      <button data-tab="movies"><i class="bullet" style="--c:var(--dusk-hi)"></i>Movies</button>
      <button data-tab="tv"><i class="bullet" style="--c:var(--sage)"></i>TV</button>
      <button data-tab="library"><i class="bullet" style="--c:var(--lotus)"></i>Library</button>
      <button data-tab="search"><i class="bullet" style="--c:var(--fog)"></i>Search</button>
    </nav>
    <div class="board">
      <div class="flap"><small>CH</small><b>09</b></div>
      <div class="flap time"><small>NOW</small><b id="clock"></b></div>
    </div>
  </header>

  <main id="view"></main>
  <div id="toast" hidden></div>
  <script src="library.js"></script>
  <script src="app.js"></script>
  <script src="search.js"></script>
</body>
</html>
